const table=(headers,rows)=>`<div class="tablewrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">Chưa có dữ liệu phù hợp.</td></tr>`}</tbody></table></div>`;
const field=(key,label,type='text',value='',required=false,options=null,wide=false)=>`<label class="field ${wide?'wide':''}">${label}${required?' <span class="required">*</span>':''}${options?`<select name="${key}" ${required?'required':''}>${!required?'<option value="">Chưa chọn</option>':''}${options.map(o=>{let a=typeof o==='string'?[o,o]:o;return `<option value="${esc(a[0])}" ${a[0]===value?'selected':''}>${esc(a[1])}</option>`}).join('')}</select>`:type==='textarea'?`<textarea name="${key}" ${required?'required':''}>${esc(value)}</textarea>`:`<input name="${key}" type="${type}" value="${esc(value)}" ${required?'required':''}>`}</label>`;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,4200)}
function changeRole(v){role=v;$('#user-name').textContent=roleNames[role];if(!permissions[role].includes(page))page='overview';sub='';query='';render()}
function go(p){if(!permissions[role].includes(p)){toast('ROLE này không có quyền xem mục đó trong bản thiết kế.');return}page=p;sub='';query='';filter='';$('#sidebar').classList.remove('open');render();window.scrollTo(0,0)}
function nav(){let html='';for(const [label,items]of menus){const allowed=items.filter(x=>permissions[role].includes(x));if(allowed.length)html+=`<div class="nav-label">${role==='content'&&label==='VẬN HÀNH SÀN'?'DỮ LIỆU':label}</div>`+allowed.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')"><span class="dot">${({overview:'◫',tasks:'☷',reports:'▤',sales:'▥',koc:'◇',imports:'↑',production:'▷',videos:'▣',employees:'◯',candidates:'◎',contracts:'▱',birthdays:'◷',users:'⊞',accounts:'⌑',history:'◴',templates:'▧',settings:'⚙',profile:'○'})[x]}</span>${pages[x]}</button>`).join('')}$('#nav').innerHTML=html;$('#crumb').textContent='Không gian làm việc / '+pages[page];$('#notice-count').textContent=notices.filter(x=>!x.read&&(!x.hr||role==='hr'||role==='admin')).length}
function header(actions=''){return `<div class="heading"><div><div class="eyebrow">SUPER NET WORKSPACE</div><h1>${pages[page]}</h1><p class="muted">${({overview:'Theo dõi công việc, kết quả và những việc cần xử lý.',tasks:'Một danh sách rõ ràng, cập nhật trong lúc làm.',sales:'Doanh số và trạng thái đơn hàng theo nguồn đã nhập.',koc:'Theo dõi hiệu quả nhà sáng tạo và tỷ trọng Top 10.',imports:'Chọn loại báo cáo trước khi tải file; giữ nguyên tên file gốc.',production:'Từ kịch bản đến clip hoàn chỉnh và từng lượt đăng.',videos:'Theo dõi số liệu video theo thời điểm ghi nhận.',employees:'Hồ sơ, mốc công tác và lịch sử lương của nhân viên.',candidates:'Theo dõi ứng tuyển, phỏng vấn và tiếp nhận nhân viên.',contracts:'Theo dõi hồ sơ cần ký và ngày hết hạn.',birthdays:'Danh sách sinh nhật theo tháng, tách nhân viên và ứng viên.',reports:'Tổng hợp theo tuần và lưu từng phiên bản đã nộp.',users:'Cấp tài khoản và phân quyền theo 5 ROLE.',accounts:'Tài khoản được chia sẻ cho từng người.',history:'Lịch sử cập nhật mật khẩu tài khoản nền tảng.',templates:'Mẫu checklist theo ba chuyên môn.',settings:'Lịch, mốc nhắc và chính sách sử dụng.',notifications:'Mở đúng hồ sơ hoặc báo cáo từ thông báo.',profile:'Thông tin truy cập và đổi mật khẩu website.'})[page]}</p></div><div class="actions">${actions}</div></div>`}
function render(){nav();const fn={overview:overviewPage,tasks:tasksPage,sales:salesPage,koc:kocPage,imports:importsPage,production:productionPage,videos:videosPage,employees:employeesPage,candidates:candidatesPage,contracts:contractsPage,birthdays:birthdaysPage,reports:reportsPage,users:usersPage,accounts:accountsPage,history:historyPage,templates:templatesPage,settings:settingsPage,notifications:notificationsPage,profile:profilePage}[page];$('#app').innerHTML=fn()+`<footer class="footer">SUPER NET · Bản mẫu v1 · Thời gian Asia/Ho_Chi_Minh · Dữ liệu thay đổi trong phiên, không lưu vào hệ thống thật</footer>`;if(devVisible)renderDev()}
function visibleTasks(){return tasks.filter(t=>role==='admin'||role==='boss'||people.find(p=>p.id===t.owner)?.job===role)}
function taskTable(list){return table(['Nhiệm vụ','Người phụ trách','Thời hạn','Trạng thái'],list.map(t=>`<tr class="clickrow" onclick="openTask('${t.id}')"><td><strong>${esc(t.title)}</strong><div class="small muted">${t.id}</div></td><td>${person(t.owner)}</td><td>${esc(t.due.replace('T',' '))}</td><td>${badge(statusNames[t.status],t.status==='cancelled'?'gray':t.status==='waiting'?'warn':'')}</td></tr>`))}
function overviewPage(){let ts=visibleTasks(),completed=ts.filter(t=>t.status==='done').length;return header(`<button class="primary" onclick="createTask()">+ ${role==='boss'||role==='admin'?'Giao công việc':'Thêm công việc'}</button>`)+`<div class="kpis">${kpi('Công việc hiện có',ts.length,'Trong phạm vi ROLE đang xem')}${kpi('Chưa thực hiện',ts.filter(t=>t.status==='waiting').length,'Đang chờ bắt đầu')}${kpi('Đang thực hiện',ts.filter(t=>t.status==='doing').length,'Cần cập nhật tiến độ')}${kpi('Đã hoàn thành',completed,'Dữ liệu task minh họa')}</div><div class="grid"><div class="panel"><div class="row"><h2>${role==='boss'||role==='admin'?'Tiến độ đội ngũ':'Công việc cần theo dõi'}</h2><button onclick="go('tasks')">Xem tất cả</button></div>${taskTable(ts.filter(t=>!['done','cancelled'].includes(t.status)))}</div><div><div class="panel"><h2>Báo cáo cuối tuần</h2><p>Tuần 02–08/11/2026</p>${people.filter(p=>role==='admin'||role==='boss'||p.job===role).map(p=>`<div class="switchline"><span>${esc(p.name)}</span>${badge(reports.some(r=>r.owner===p.id)?'Đã nộp':'Chưa nộp',reports.some(r=>r.owner===p.id)?'':'warn')}</div>`).join('')}<button style="margin-top:16px" onclick="go('reports')">Mở báo cáo tuần</button></div>${role==='hr'||role==='admin'?`<div class="panel"><h2>HR cần xử lý</h2><p>1 nhân viên sắp hết thử việc.</p><button onclick="go('contracts')">Xem hợp đồng & nhắc việc</button></div>`:''}</div></div>`}
function tasksPage(){let list=visibleTasks().filter(t=>(!query||t.title.toLowerCase().includes(query.toLowerCase())||names(t.owner).toLowerCase().includes(query.toLowerCase()))&&(!filter||t.status===filter));return header(`<button class="primary" onclick="createTask()">+ ${['admin','boss'].includes(role)?'Giao công việc':'Thêm công việc'}</button>`)+`<div class="toolbar"><input aria-label="Tìm công việc" placeholder="Tìm công việc hoặc nhân viên…" value="${esc(query)}" onchange="query=this.value;render()"><select aria-label="Lọc trạng thái" onchange="filter=this.value;render()"><option value="">Tất cả trạng thái</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${filter===k?'selected':''}>${v}</option>`).join('')}</select><button onclick="board=!board;render()">${board?'Dạng danh sách':'Dạng checklist theo trạng thái'}</button></div>${board?`<div class="board">${Object.entries(statusNames).map(([s,l])=>`<div class="column"><h3>${l} <small>(${list.filter(t=>t.status===s).length})</small></h3>${list.filter(t=>t.status===s).map(t=>`<div class="taskcard" onclick="openTask('${t.id}')"><strong>${esc(t.title)}</strong><p class="small muted">${esc(names(t.owner))}</p><small>${esc(t.due.replace('T',' '))}</small></div>`).join('')}</div>`).join('')}</div>`:`<div class="panel">${taskTable(list)}</div>`}`}
function modal(title,body,footer=''){const d=$('#modal');$('#modal-content').innerHTML=`<header class="dialog-head"><h2>${title}</h2><button aria-label="Đóng" onclick="closeDialog('modal')">×</button></header><div class="dialog-body">${body}</div>${footer?`<footer class="dialog-footer">${footer}</footer>`:''}`;if(!d.open)d.showModal()}
function drawer(title,body){$('#detail-content').innerHTML=`<header class="dialog-head"><div><div class="eyebrow">CHI TIẾT</div><h2>${title}</h2></div><button aria-label="Đóng chi tiết" onclick="closeDialog('detail')">×</button></header><div class="dialog-body">${body}</div>`;if(!$('#detail').open)$('#detail').showModal()}
function closeDialog(id){let d=$('#'+id);if(d.dataset.dirty==='true'&&!confirm('Bạn có nội dung chưa lưu. Đóng và bỏ nội dung?'))return;d.dataset.dirty='false';d.close()}
['modal','detail'].forEach(id=>{$('#'+id).addEventListener('change',()=>$('#'+id).dataset.dirty='true');$('#'+id).addEventListener('cancel',e=>{e.preventDefault();closeDialog(id)})});
function createTask(){let eligible=people.filter(p=>['admin','boss'].includes(role)||p.job===role);modal('Tạo công việc',`<form onsubmit="saveTask(event)"><div class="fields">${field('title','Nội dung công việc','text','',true,null,true)}${field('owner','Người phụ trách','text',eligible[0]?.id,true,eligible.map(p=>[p.id,p.name]))}${field('due','Thời hạn','datetime-local','2026-11-13T18:00',true)}${field('description','Mô tả / kết quả mong muốn','textarea','',false,null,true)}${field('file','Tài liệu đính kèm','file','',false,null,true)}</div><p class="datahint">Trạng thái ban đầu: Chưa thực hiện. Có thể bổ sung kết quả trong lúc làm.</p><button class="primary" type="submit">Lưu công việc</button></form>`)}
function saveTask(e){e.preventDefault();let f=new FormData(e.target);tasks.unshift({id:'CV-'+String(tasks.length+1).padStart(3,'0'),title:f.get('title'),owner:f.get('owner'),due:f.get('due'),description:f.get('description'),status:'waiting',result:'',reason:''});$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã thêm công việc vào bản mẫu. Tệp chọn trong form chưa được lưu lên máy chủ.')}
function openTask(id){let t=tasks.find(t=>t.id===id);let readonly=role==='boss';drawer(esc(t.title),`<div class="row"><span class="muted">${t.id} · ${esc(names(t.owner))}</span>${badge(statusNames[t.status])}</div><div class="tabs"><button class="active" onclick="taskTab('${id}','info')">Thông tin & cập nhật</button><button onclick="taskTab('${id}','discussion')">Trao đổi</button></div><div id="task-body">${taskBody(t,readonly)}</div>`)}
function taskBody(t,readonly){return `<div class="panel"><h3>Yêu cầu công việc</h3><p>${esc(t.description||'Chưa bổ sung mô tả.')}</p><div class="muted small">Thời hạn: ${esc(t.due.replace('T',' '))}</div></div>${t.status==='cancelled'?`<div class="note">Lý do hủy: ${esc(t.reason)}</div>`:''}${readonly?`<div class="note info">Sếp theo dõi tiến độ. Nhân viên cập nhật trạng thái và kết quả.</div><h3>Cập nhật gần nhất</h3><p>${esc(t.result||'Chưa có cập nhật.')}</p>`:t.status==='cancelled'?`<p>${esc(t.result)}</p>`:`<form onsubmit="updateTask(event,'${t.id}')"><div class="fields">${field('status','Trạng thái','text',t.status,true,Object.entries(statusNames).filter(([k])=>k!=='cancelled'))}${field('result','Đã làm gì / kết quả','textarea',t.result,t.status==='done',null,true)}</div><div class="actions"><button class="primary">Lưu cập nhật</button>${t.status!=='done'?`<button type="button" class="danger" onclick="cancelTask('${t.id}')">Hủy công việc</button>`:''}</div></form>`}<details><summary>Lịch sử công việc</summary><p class="small muted">10/11/2026 · Tạo công việc trong dữ liệu minh họa. Bản thật lưu người thay đổi, thời điểm và trạng thái trước/sau.</p></details>`}
function taskTab(id,tab){if(tab==='info')openTask(id);else $('#task-body').innerHTML=`<h3>Trao đổi trong công việc</h3><div class="note info">Chỉ người tham gia và người có quyền theo dõi được đọc trao đổi.</div><div id="messages"><p class="muted">Chưa có trao đổi trong bản mẫu.</p></div><form onsubmit="event.preventDefault();document.getElementById('messages').insertAdjacentHTML('beforeend','<p><strong>'+roleNames[role]+'</strong>: '+esc(new FormData(event.target).get('message'))+'</p>');event.target.reset();document.getElementById('detail').dataset.dirty='false'">${field('message','Nội dung trao đổi','textarea','',true)}<button class="primary">Gửi trao đổi</button></form>`}
function updateTask(e,id){e.preventDefault();let f=new FormData(e.target),t=tasks.find(t=>t.id===id);if(f.get('status')==='done'&&!String(f.get('result')).trim()){toast('Cần ghi kết quả trước khi đánh dấu hoàn thành.');return}t.status=f.get('status');t.result=f.get('result');$('#detail').dataset.dirty='false';openTask(id);render();toast('Đã lưu cập nhật trong bản mẫu.')}
function cancelTask(id){modal('Hủy công việc',`<p>Lưu lý do để người theo dõi biết vì sao công việc dừng lại.</p><form onsubmit="event.preventDefault();let reason=new FormData(event.target).get('reason').trim();if(!reason)return;let t=tasks.find(x=>x.id==='${id}');t.status='cancelled';t.reason=reason;document.getElementById('modal').dataset.dirty='false';document.getElementById('modal').close();document.getElementById('detail').dataset.dirty='false';openTask('${id}');render();toast('Đã hủy công việc và lưu lý do trong bản mẫu.')">${field('reason','Lý do hủy','textarea','',true)}<div class="actions"><button type="button" onclick="closeDialog('modal')">Quay lại</button><button class="danger">Xác nhận hủy</button></div></form>`)}
function salesPage(){let platform=sub||'tiktok',src=SOURCE[platform],t=src.totals;return header(`<button class="primary" onclick="uploadKind='${platform}';go('imports')">Tải báo cáo lên</button>`)+`<div class="tabs">${['tiktok','shopee'].map(k=>`<button class="${platform===k?'active':''}" onclick="sub='${k}';render()">${k==='tiktok'?'TikTok Shop':'Shopee'}</button>`).join('')}</div><div class="toolbar"><span class="period">Cửa hàng mẫu · Chưa xác nhận tên cửa hàng nguồn</span><span class="period">02/11/2026 – 08/11/2026</span></div><div class="source-tag">Số liệu đọc từ file bạn gửi · Chỉ dùng duyệt thiết kế · Không phải dữ liệu đã nhập vào hệ thống thật</div><div class="kpis">${kpi('Doanh thu nguồn',money(t.revenue),'Cột Doanh thu',true)}${kpi('Tổng số đơn hàng',n(t.orders),'Cột Tổng số đơn hàng')}${kpi('Đơn đã hủy',n(t.cancelled),pct(t.cancelled,t.orders)+' trên tổng đơn')}${kpi('Đơn hoàn tiền',n(t.refunded),pct(t.refunded,t.orders)+' trên tổng đơn')}</div><div class="grid"><div class="panel"><h2>Doanh thu theo ngày</h2><div class="chart">${src.daily.slice().reverse().map(d=>`<div><i style="height:${Math.max(5,d.revenue/Math.max(...src.daily.map(d=>d.revenue))*112)}px" title="${money(d.revenue)}"></i><small>${esc(d.date.slice(0,5))}</small></div>`).join('')}</div></div><div class="panel"><h2>Đối chiếu chỉ tiêu</h2><div class="switchline"><span>Doanh thu đơn hàng hiệu quả</span><strong>${money(t.effective)}</strong></div><div class="switchline"><span>Số tiền hoàn nguồn</span><strong>${money(t.refund_amount)}</strong></div><p class="small muted" style="margin-top:12px">Giữ riêng doanh thu nguồn và doanh thu đơn hàng hiệu quả. “Hoàn tiền” chưa đồng nghĩa hàng đã trả về kho.</p></div></div><div class="panel"><h2>Chi tiết theo ngày</h2>${table(['Ngày','Doanh thu','Tổng đơn','Hủy','Hoàn tiền','Tỷ lệ hủy','Tỷ lệ hoàn tiền'],src.daily.map(d=>`<tr><td>${esc(d.date)}</td><td class="num">${money(d.revenue)}</td><td class="num">${n(d.orders)}</td><td class="num">${n(d.cancelled)}</td><td class="num">${n(d.refunded)}</td><td>${pct(d.cancelled,d.orders)}</td><td>${pct(d.refunded,d.orders)}</td></tr>`))}<p class="datahint">Tỷ lệ tuần = tổng số đơn tương ứng / tổng số đơn trong cùng kỳ; không lấy trung bình tỷ lệ từng ngày.</p></div>`}
function kocPage(){let s=SOURCE.koc,t=s.totals;return header(`<button class="primary" onclick="uploadKind='koc';go('imports')">Tải dữ liệu KOC</button>`)+`<div class="note">File mẫu chưa thể hiện kỳ dữ liệu. Các số dưới đây là tổng của file đã gửi, chưa gắn nhãn doanh số tuần.</div><div class="kpis">${kpi('GMV từ KOC',money(t.gmv),'Toàn bộ KOC trong file',true)}${kpi('Đơn hàng ghi nhận',n(t.orders),'Không cộng với tổng đơn sàn')}${kpi('Hoa hồng ước tính',money(t.commission),'Chưa phải hoa hồng quyết toán',true)}${kpi('Hoàn tiền',money(t.refund),'Có thể khác kỳ phát sinh GMV',true)}</div><div class="panel"><div class="row"><h2>Top 10 KOC theo GMV</h2><span class="muted small">Tỷ trọng trên tổng GMV của ${n(s.count)} KOC</span></div>${table(['Hạng','Nhà sáng tạo','GMV','Tỷ trọng','Đơn','Hoa hồng ước tính','Hoàn tiền'],s.top.map((x,i)=>`<tr><td>${i+1}</td><td><strong>${esc(x.name)}</strong><div class="progress"><i style="width:${x.gmv/t.gmv*100}%"></i></div></td><td class="num">${money(x.gmv)}</td><td>${pct(x.gmv,t.gmv)}</td><td>${n(x.orders)}</td><td class="num">${money(x.commission)}</td><td class="num">${money(x.refund)}</td></tr>`))}</div><div class="note info">GMV KOC là một phần doanh số theo nguồn quy kết, không cộng thêm vào tổng doanh thu sàn. File này chưa đủ để tách số đơn hủy và đơn trả hàng riêng biệt theo KOC.</div>`}
const uploadTypes={tiktok:{name:'Kinh doanh TikTok Shop',sheet:'Báo cáo đơn hàng',required:['Ngày','Doanh thu','Tổng số đơn hàng','Số lượng đơn đã hủy','SL đơn hoàn tiền'],optional:['Doanh thu đơn hàng hiệu quả','Số tiền đơn hàng hoàn tiền','Số tiền đơn hàng hủy','Tỷ lệ hoàn tiền'],role:'market'},shopee:{name:'Kinh doanh Shopee',sheet:'Báo cáo đơn hàng',required:['Ngày','Doanh thu','Tổng số đơn hàng','Số lượng đơn đã hủy','SL đơn hoàn tiền'],optional:['Doanh thu đơn hàng hiệu quả','Số tiền đơn hàng hoàn tiền','Số tiền đơn hàng hủy','Tỷ lệ hoàn tiền'],role:'market'},koc:{name:'Doanh số KOC TikTok',sheet:'Theo nhà sáng tạo',required:['Tên nhà sáng tạo','GMV nhờ nhà sáng tạo','Đơn hàng đã ghi nhận','Hoàn tiền','Hoa hồng ước tính'],optional:['GMV đến từ video liên kết','GMV nhờ buổi LIVE của nhà sáng tạo','Số món đã hoàn tiền'],role:'market'},returns:{name:'Chi tiết hoàn / hủy TikTok',sheet:'Chi tiết Order / SKU',required:['Order ID','Order Status','Cancelation/Return Type','Order Amount','Order Refund Amount','Created Time'],optional:['Cancelled Time','SKU ID','Sku Quantity of return','Creator Handle'],role:'market'},video:{name:'Hiệu quả video TikTok',sheet:'Theo link video',required:['Video title','Video link','Post time','Total likes','Total comments','Total shares','Total views'],optional:['Time'],role:'content'}};

async function readWorkbook(file){if(/\.csv$/i.test(file.name)){let text=await file.text();if(text.includes('\0'))throw Error('File CSV không phải văn bản hợp lệ.');let delim=text.split('\n')[0].includes(';')?';':',',rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===delim&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(Boolean))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('CSV bị thiếu dấu đóng ngoặc kép.');row.push(cell);if(row.some(Boolean))rows.push(row);return [{name:'CSV',rows}]}let zip=await unzipXlsx(await file.arrayBuffer()),wb=await zip.get('xl/workbook.xml'),rels=await zip.get('xl/_rels/workbook.xml.rels');if(!wb||!rels)throw Error('File không phải workbook Excel được hỗ trợ.');let ss=await zip.get('xl/sharedStrings.xml'),strings=ss?tags(parseXml(ss),'si').map(x=>tags(x,'t').map(t=>t.textContent).join('')):[],targets={};for(let r of tags(parseXml(rels),'Relationship'))targets[r.getAttribute('Id')]=r.getAttribute('Target');let out=[];for(let sh of tags(parseXml(wb),'sheet')){let id=sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id'),t=targets[id];if(!t)continue;t=t.startsWith('/')?t.slice(1):'xl/'+t;let segments=[];for(let p of t.split('/')){if(p==='..')segments.pop();else if(p!=='.')segments.push(p)}let xml=await zip.get(segments.join('/'));if(!xml)continue;let grid=new Map();for(let c of tags(parseXml(xml),'c')){let address=c.getAttribute('r');if(!address)continue;let r=Number(address.replace(/[A-Z]/g,'')),ci=colIndex(address);if(!grid.has(r))grid.set(r,[]);let val=tags(c,'v')[0]?.textContent||'';if(c.getAttribute('t')==='s')val=strings[Number(val)]||'';if(c.getAttribute('t')==='inlineStr')val=tags(c,'t').map(x=>x.textContent).join('');grid.get(r)[ci]=val}out.push({name:sh.getAttribute('na function validateRows(r,kind){let errors=[];let numeric=kind==='koc'?['GMV nhờ nhà sáng tạo','Đơn hàng đã ghi nhận','Hoàn tiền','Hoa hồng ước tính']:kind==='video'?['Total likes','Total comments','Total shares','Total views']:kind==='returns'?['Order Amount','Order Refund Amount']:['Doanh thu','Tổng số đơn hàng','Số lượng đơn đã hủy','SL đơn hoàn tiền'];for(let row of r.data){for(let h of numeric){let v=parseNum(row.values[r.map[h]]);if(v===null||!Number.isFinite(v)||v<0)errors.push(`Sheet ${r.sheet}, dòng ${row.index}, cột ${h}: cần số không âm, không được bỏ trống.`);if(/đơn|Total likes|Total views|Total shares|Total comments/.test(h)&&Number.isFinite(v)&&!Number.isInteger(v))errors.push(`Dòng ${row.index}, ${h}: cần số nguyên.`)}if(['tiktok','shopee'].includes(kind)){let d=String(row.values[r.map['Ngày']]||'');if(!/^\d{2}\/\d{2}\/\d{4}$/.test(d))errors.push(`Dòng ${row.index}: ngày cần theo định dạng DD/MM/YYYY.`);else{let [day,m,y]=d.split('/').map(Number),date=new Date(Date.UTC(y,m-1,day));if(date.getUTCDate()!==day||date.getUTCMonth()!==m-1)errors.push(`Dòng ${row.index}: ngày không tồn tại.`)}}if(kind==='returns'&&!/^\d{8,}$/.test(String(row.values[r.map['Order ID']]||'')))errors.push(`Dòng ${row.index}: Order ID cần là chuỗi mã đơn hợp lệ.`);if(kind==='video'){try{let url=new URL(row.values[r.map['Video link']]);if(!['http:','https:'].includes(url.protocol))throw Error()}catch{errors.push(`Dòng ${row.index}: Video link không hợp lệ.`)}}if(errors.length>30)break}return errors}
async function checkUpload(){const file=$('#source-file')?.files[0],ctx=contextUpload();if(!file){toast('Chọn file trước khi kiểm tra.');return}if(!ctx.shop||!ctx.company||!ctx.start||!ctx.end){toast('Chọn cửa hàng, pháp nhân và kỳ dữ liệu trước.');return}if(ctx.start>ctx.end){toast('Ngày kết thúc không được trước ngày bắt đầu.');return}if(!/\.(xlsx|csv)$/i.test(file.name)){showUploadError('Chỉ nhận file XLSX hoặc CSV. Hãy chọn lại file xuất từ hệ thống.');return}if(file.size>25*1024*1024){showUploadError('File vượt 25 MB. Hãy xuất lại phạm vi nhỏ hơn.');return}let kind=uploadKind,token=++uploadGeneration;$('#check-file').disabled=true;$('#import-preview').innerHTML='<div class="panel skeleton" role="status">Đang đọc file và kiểm tra dữ liệu…</div>';try{let r=matchWorkbook(await readWorkbook(file),kind);let errors=validateRows(r,kind);if(errors.length)throw Error(errors.join('\n'));if(token!==uploadGeneration)return;uploadResult={...r,...ctx,kind,name:file.name,sample:false};showUploadPreview()}catch(e){if(token===uploadGeneration)showUploadError(e.message)}finally{if($('#check-file'))$('#check-file').disabled=false}}

function productionPage(){return header(`<button class="primary" onclick="createProduction()">+ Tạo nội dung</button>`)+`<div class="kpis">${productionStages.map((s,i)=>kpi(s,productions.filter(p=>p.stage===i).length,'Hồ sơ minh họa ở trạng thái hiện tại')).join('')}</div><div class="note info">Thống kê hoàn thành trong báo cáo tuần dựa trên ngày hoàn tất từng bước, không chỉ đếm trạng thái hiện tại. Một video có thể có nhiều lượt đăng.</div><div class="board">${productionStages.map((s,i)=>`<div class="column"><h3>${s}</h3>${productions.filter(p=>p.stage===i).map(p=>`<div class="taskcard" onclick="openProduction('${p.id}')"><div class="small muted">${p.id}</div><strong>${esc(p.title)}</strong><p class="small">${esc(names(i<2?p.writer:p.editor))}</p><small class="muted">Hạn ${p.due}</small></div>`).join('')}</div>`).join('')}</div>`}

function saveProduction(e){e.preventDefault();let f=new FormData(e.target);productions.unshift({id:'ND'+String(productions.length+1).padStart(3,'0'),title:f.get('title'),stage:0,writer:f.get('writer'),camera:'',actor:'',editor:'',place:'',shoot:'',script:f.get('brief'),raw:'',final:'',due:f.get('due')});$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã tạo nội dung trong bản mẫu.')}
function openProduction(id,tab='script'){let p=productions.find(x=>x.id===id),opts=people.map(x=>[x.id,x.name]);drawer(esc(p.title),`<div class="small muted">${p.id} · ${badge(productionStages[p.stage])}</div><div class="pipeline">${productionStages.map((s,i)=>`<span class="${i===p.stage?'current':''}">${i+1}. ${s}</span>`).join('')}</div><div class="tabs">${[['script','Kịch bản'],['shoot','Quay'],['edit','Dựng'],['publish','Đăng video']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="openProduction('${id}','${k}')">${l}</button>`).join('')}</div><form onsubmit="saveProductionStep(event,'${id}','${tab}')">${tab==='script'?`${field('script','Nội dung thoại / kịch bản','textarea',p.script,true)}${field('writer','Người viết kịch bản','text',p.writer,true,opts)}${field('script-file','Tài liệu kịch bản đính kèm','file')}<button class="primary">Lưu kịch bản</button> <button type="submit" name="advance" value="1">Hoàn tất kịch bản → Chờ quay</button>`:tab==='shoot'?`<div class="fields">${field('place','Quay ở đâu','text',p.place,true)}${field('shoot','Lịch quay dự kiến','datetime-local',p.shoot,true)}${field('camera','Ai quay','text',p.camera,true,opts)}${field('actor','Quay với ai','text',p.actor,true,opts)}${field('actual-shoot','Thời điểm quay thực tế','datetime-local',p.shoot,true)}${field('raw','Link / mô tả tư liệu quay','textarea',p.raw,true,null,true)}${field('raw-files','Tệp tư liệu quay','file','',false,null,true)}</div><button class="primary">Lưu thông tin quay</button> <button type="submit" name="advance" value="1">Đã quay xong → Chờ dựng</button>`:tab==='edit'?`${field('editor','Ai dựng clip','text',p.editor,true,opts)}${field('final','Link clip hoàn chỉnh','url','',true)}${field('edit-note','Ghi chú hậu kỳ','textarea',p.final)}${field('edit-finished','Ngày hoàn tất dựng','datetime-local','2026-11-10T15:00',true)}<button class="primary">Lưu thông tin dựng</button> <button type="submit" name="advance" value="1">Hoàn tất dựng</button>`:`<div class="note">Mỗi lần đăng là một bản ghi riêng. Chỉ đăng sau khi clip hoàn chỉnh; không thay ngày hoàn tất dựng bằng ngày đăng.</div><div class="fields">${field('platform','Nền tảng','text','TikTok',true,['TikTok','Facebook','YouTube','Shopee'])}${field('channel','Kênh đăng','text','Kênh mẫu 1',true,['Kênh mẫu 1','Kênh mẫu 2'])}${field('published','Ngày giờ đã đăng','datetime-local','2026-11-10T14:00',true)}${field('url','Link video đã đăng','url','',true)}</div><button class="primary">Lưu lượt đăng</button>`}</form><details><summary>Dữ liệu cần có ở bước này</summary><p class="small">Kịch bản: lời thoại + người viết + thời điểm hoàn tất. Quay: kế hoạch, người tham gia, người quay, ngày quay thực tế, file/link tư liệu. Dựng: người dựng, file/link clip và ngày hoàn tất. Đăng: mã nội dung, nền tảng, kênh, link và thời điểm đăng.</p></details>`)}
let localPublications=[];
function saveProductionStep(e,id,tab){e.preventDefault();let p=productions.find(x=>x.id===id),f=new FormData(e.target),advance=e.submitter?.value==='1',idx={script:0,shoot:1,edit:2,publish:3}[tab];if(p.stage<idx){toast('Cần hoàn tất bước trước trước khi lưu bước này.');return}if(tab==='publish'){if(new Date(f.get('published')+'+07:00')>new Date('2026-11-10T23:59:59+07:00')){toast('Không ghi nhận đã đăng với thời điểm tương lai của ngày mẫu.');return}localPublications.push({title:p.title,link:f.get('url'),platform:f.get('platform'),channel:f.get('channel'),posted:f.get('published'),views:null});toast('Đã thêm lượt đăng trong bản mẫu. Chưa có dữ liệu hiệu quả.')}else{for(let [k,v]of f.entries())if(['script','writer','place','shoot','camera','actor','raw','editor','final'].includes(k))p[k]=v;if(advance)p.stage=Math.max(p.stage,Math.min(3,idx+1));toast('Đã lưu bước sản xuất trong bản mẫu. Tệp chưa được tải lên máy chủ.')}$('#detail').dataset.dirty='false';openProduction(id,tab);render()}
function videosPage(){let items=[...SOURCE.video.items,...localPublications];return header(`<button class="primary" onclick="uploadKind='video';go('imports')">Tải số liệu video</button>`)+`<div class="note">File mẫu ghi ngày chốt “10 tháng Mười Một”, thiếu năm; chưa có GMV. Các số hiện có là số liệu tại lần ghi nhận, chưa chứng minh đúng 7 ngày sau đăng.</div><div class="toolbar"><select aria-label="Lọc kỳ video" onchange="sourceMode=this.value;render()"><option value="all">Tất cả lượt đăng</option><option value="d7" ${sourceMode==='d7'?'selected':''}>Đủ dữ liệu D7</option><option value="missing" ${sourceMode==='missing'?'selected':''}>Chưa đủ dữ liệu D7</option></select></div><div class="panel">${table(['Video / kênh','Ngày đăng nguồn','Lượt xem','Tương tác / lượt xem','GMV D7','Trạng thái D7'],(sourceMode==='d7'?[]:items).map((v,i)=>`<tr class="clickrow" onclick="openVideo(${i})"><td><strong class="v-title">${esc(v.title)}</strong><a href="${esc(v.link)}" target="_blank" rel="noopener">Mở video</a></td><td>${esc(v.posted)}<div class="small muted">${v.platform||'TikTok'}</div></td><td class="num">${v.views===null?'Chưa có':n(v.views)}</td><td>${v.views?pct(v.likes+v.comments+v.shares,v.views):'Chưa có'}</td><td>Chưa có dữ liệu</td><td>${badge('Chưa đủ căn cứ D7','warn')}</td></tr>`))}</div><p class="datahint">Tương tác hiển thị = (thích + bình luận + chia sẻ) / lượt xem của cùng lần ghi nhận. Không suy ra GMV từ lượt xem.</p>`}

function employeesPage(){let list=employees.filter(e=>(sub==='archived'?e.state==='left':e.state==='active')&&(!query||[e.name,e.id,e.team].join(' ').toLowerCase().includes(query.toLowerCase())));return header(`<button class="primary" onclick="employeeEditor()">+ Thêm nhân viên</button>`)+`<div class="tabs"><button class="${sub!=='archived'?'active':''}" onclick="sub='';render()">Đang làm việc</button><button class="${sub==='archived'?'active':''}" onclick="sub='archived';render()">Đã nghỉ việc / lưu trữ</button></div><div class="kpis">${kpi('Nhân viên đang làm',employees.filter(e=>e.state==='active').length,'Hồ sơ minh họa')}${kpi('Đang thử việc',employees.filter(e=>e.phase==='Thử việc'&&e.state==='active').length)}${kpi('Sắp hết thử việc','1','Mốc nhắc theo cấu hình')}${kpi('Hồ sơ cần bổ sung','2','Checklist tài liệu theo loại hợp đồng')}</div><div class="toolbar"><input aria-label="Tìm nhân viên" placeholder="Tên, mã nhân viên, bộ phận…" value="${esc(query)}" onchange="query=this.value;render()"><button onclick="toast('Bản thật xuất XLSX theo bộ lọc và quyền; không đưa lương vào file hồ sơ cơ bản.')">Xuất danh sách</button></div><div class="panel">${table(['Nhân viên','Bộ phận / vị trí','Giai đoạn','Ngày nhận việc','Tài khoản','Hồ sơ'],list.map(e=>`<tr class="clickrow" onclick="openEmployee('${e.id}')"><td><strong>${esc(e.name)}</strong><div class="small muted">${e.id}</div></td><td>${esc(e.team)}<div class="small muted">${roleNames[e.job]}</div></td><td>${badge(e.phase,e.phase==='Thử việc'?'warn':'')}</td><td>${e.joined}</td><td>${esc(e.user||'Chưa cấp')}</td><td>${badge(e.id==='NS002'?'Cần bổ sung':'Đang lưu',e.id==='NS002'?'warn':'gray')}</td></tr>`))}</div>`}
function employeeEditor(id){let e=employees.find(x=>x.id===id)||{};modal(id?'Chỉnh sửa hồ sơ nhân viên':'Tạo hồ sơ nhân viên',`<form onsubmit="saveEmployee(event,'${id||''}')"><div class="fields">${field('id','Mã nhân viên','text',e.id||'',true)}${field('name','Họ tên','text',e.name||'',true)}${field('team','Bộ phận','text',e.team||'Marketing',true,['Marketing','Vận hành sàn','Nhân sự'])}${field('job','Vị trí công việc','text',e.job||'content',true,Object.entries(roleNames).filter(([k])=>['market','hr','content'].includes(k)))}${field('joined','Ngày nhận việc','date','2026-11-10',true)}${field('birthday','Ngày sinh','date','')}${field('phase','Giai đoạn','text',e.phase||'Thử việc',true,['Thử việc','Chính thức'])}${field('type','Loại hình làm việc','text',e.type||'Toàn thời gian',true,['Toàn thời gian','Bán thời gian','Thực tập sinh','Cộng tác viên'])}</div><details><summary>Liên hệ và thông tin bổ sung</summary>${field('phone','Số điện thoại','tel')}${field('email','Email cá nhân','email')}${field('address','Địa chỉ','textarea')}</details><div class="note info">Vị trí trong hồ sơ không tự cấp quyền. Sau khi lưu có thể cấp tài khoản và ROLE chuyên môn riêng.</div><button class="primary">Lưu hồ sơ</button></form>`);if(id){let form=$('#modal form');form.elements.id.readOnly=true;form.elements.joined.value=toISO(e.joined);form.elements.birthday.value=toISO(e.birthday)}}
function toISO(s){let a=String(s||'').split('/');return a.length===3?a.reverse().join('-'):''}function humanDate(s){return s?s.split('-').reverse().join('/'):''}
function saveEmployee(event,id){event.preventDefault();let f=new FormData(event.target),code=String(f.get('id')).trim(),old=employees.find(e=>e.id===id);if(employees.some(e=>e.id.toLowerCase()===code.toLowerCase()&&e!==old)){toast('Mã nhân viên đã tồn tại.');return}let data={id:code,name:f.get('name'),team:f.get('team'),job:f.get('job'),phase:f.get('phase'),type:f.get('type'),joined:humanDate(f.get('joined')),birthday:humanDate(f.get('birthday'))};if(old)Object.assign(old,data);else employees.push({...data,probationEnd:'',contract:'',contractEnd:'',salary:0,probationSalary:0,user:'',state:'active'});$('#modal').dataset.dirty='false';$('#modal').close();if(old&&$('#detail').open)openEmployee(old.id);render();toast('Đã lưu hồ sơ trong bản mẫu.')}
function openEmployee(id,tab='info'){let e=employees.find(x=>x.id===id);drawer(esc(e.name),`<div class="row"><span class="small muted">${e.id} · ${esc(e.team)}</span>${badge(e.state==='left'?'Đã nghỉ việc':e.phase)}</div><div class="tabs">${[['info','Thông tin'],['work','Công tác & hợp đồng'],['salary','Lương'],['docs','Tài liệu'],['history','Lịch sử']].map(([k,l])=>`<button class="${tab===k?'active':''}" onclick="openEmployee('${id}','${k}')">${l}</button>`).join('')}</div>${tab==='info'?`<div class="panel"><h3>Thông tin nhân viên</h3>${table(['Thông tin','Giá trị'],[['Mã nhân viên',e.id],['Họ tên',e.name],['Ngày sinh',e.birthday||'Chưa cung cấp'],['Bộ phận',e.team],['Vị trí',roleNames[e.job]],['Ngày nhận việc',e.joined]].map(([k,v])=>`<tr><td>${k}</td><td>${esc(v)}</td></tr>`))}</div><button class="primary" onclick="employeeEditor('${id}')">Chỉnh sửa hồ sơ</button><details><summary>Định danh, thuế, BHXH và ngân hàng</summary>${role==='admin'?'<p class="muted">Chưa có dữ liệu minh họa nhạy cảm. Bản thật dùng trường được mã hóa và quyền truy cập riêng.</p>':'<p class="note">Đề xuất giữ quyền riêng tư hiện có: HR quản lý lương; thông tin định danh/ngân hàng cần Admin. Nếu muốn mở thêm quyền HR, cần chốt trong thiết kế cuối.</p>'}</details>`:tab==='work'?`<div class="panel"><h3>Mốc công tác</h3><div class="timeline"><article><strong>Nhận việc</strong><div>${e.joined}</div></article><article><strong>Hết thử việc</strong><div>${e.probationEnd||'Chưa thiết lập'}</div></article><article><strong>Hợp đồng đang theo dõi</strong><div>${e.contract||'Chưa có'} → ${e.contractEnd||'Chưa có'}</div></article></div></div><div class="actions"><button class="primary" onclick="contractEditor('${id}')">+ Thêm / gia hạn hợp đồng</button>${!e.user&&e.state==='active'?`<button onclick="userEditor('${id}')">Cấp tài khoản & ROLE</button>`:`<span class="pill">Tài khoản: ${esc(e.user||'Chưa có')}</span>`}${e.state==='active'?`<button class="danger" onclick="leaveEmployee('${id}')">Ghi nhận nghỉ việc</button>`:''}</div><p class="datahint">Mỗi hợp đồng là một bản ghi có loại, ngày ký, hiệu lực, hết hạn, file và liên kết hợp đồng trước.</p>`:tab==='salary'?`<div class="kpis">${kpi('Lương thử việc',e.probationSalary?money(e.probationSalary):'Chưa có','Mức minh họa',true)}${kpi('Lương chính thức',e.salary?money(e.salary):'Chưa có','Mức minh họa',true)}</div><div class="panel"><h3>Lịch sử mức lương</h3>${table(['Từ ngày','Giai đoạn','Mức lương','Căn cứ'],salaryHistory.filter(x=>x.employee===id).map(x=>`<tr><td>${x.date}</td><td>${x.phase}</td><td>${money(x.amount)}</td><td>${esc(x.reason)}</td></tr>`))}<button class="primary" style="margin-top:16px" onclick="salaryEditor('${id}')">+ Điều chỉnh mức lương</button></div><div class="note info">Lưu mức cũ, mức mới, ngày hiệu lực, người cập nhật và căn cứ. Điều chỉnh tương lai không ghi đè mức đang có hiệu lực.</div>`:tab==='docs'?`<div class="panel"><h3>Hồ sơ đính kèm</h3>${['Hợp đồng thử việc','Hợp đồng chính thức','Phụ lục điều chỉnh lương','Hồ sơ tiếp nhận'].map((l,i)=>`<div class="file-list row"><span>${l}</span>${badge(i<2?'Chưa tải':'Không bắt buộc',i<2?'warn':'gray')}</div>`).join('')}<form onsubmit="event.preventDefault();toast('Đã chọn tài liệu. Bản mẫu chưa tải file lên máy chủ.')" style="margin-top:18px">${field('doc-kind','Loại tài liệu','text','Hợp đồng chính thức',true,['Hợp đồng thử việc','Hợp đồng chính thức','Phụ lục điều chỉnh lương','Hồ sơ tiếp nhận'])}${field('doc-file','Chọn tài liệu','file','',true)}<button class="primary">Tải tài liệu</button></form></div>`:`<div class="timeline"><article><strong>Hồ sơ mẫu</strong><p class="muted">Không tái tạo giả lịch sử chỉnh sửa trước/sau. Bản thật giữ lịch sử bất biến từ repo và ghi thêm thay đổi mới.</p></article></div>`}`)}
let salaryHistory=[];function salaryEditor(id){modal('Điều chỉnh mức lương',`<form onsubmit="saveSalary(event,'${id}')"><div class="fields">${field('phase','Giai đoạn','text','Chính thức',true,['Thử việc','Chính thức'])}${field('amount','Mức lương mới (VND)','number','',true)}${field('date','Có hiệu lực từ','date','2026-11-10',true)}${field('basis','Căn cứ / số phụ lục','text','',true)}</div>${field('reason','Lý do điều chỉnh','textarea','',true)}<button class="primary">Lưu mốc lương mới</button></form>`)}
function saveSalary(e,id){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount')),date=f.get('date');if(amount<0){toast('Mức lương không được âm.');return}salaryHistory.unshift({employee:id,date:humanDate(date),phase:f.get('phase'),amount,reason:f.get('basis')+' · '+f.get('reason')});let p=employees.find(x=>x.id===id);if(date<='2026-11-10'){if(f.get('phase')==='Chính thức')p.salary=amount;else p.probationSalary=amount}$('#modal').dataset.dirty='false';$('#modal').close();openEmployee(id,'salary');toast('Đã lưu mốc lương trong bản mẫu; mức tương lai chờ ngày hiệu lực.')}
function leaveEmployee(id){modal('Ghi nhận nghỉ việc',`<div class="note">Bản thật sẽ khóa tài khoản, chấm dứt phiên đăng nhập và thu hồi chia sẻ. Công việc đang mở cần bàn giao; lịch sử vẫn giữ.</div><form onsubmit="event.preventDefault();let f=new FormData(event.target);if(f.get('date')>'2026-11-10'){toast('Bản thiết kế chưa hỗ trợ tự khóa ở ngày nghỉ tương lai.');return}employees.find(e=>e.id==='${id}').state='left';document.getElementById('modal').dataset.dirty='false';document.getElementById('modal').close();document.getElementById('detail').close();render();toast('Đã chuyển hồ sơ mẫu sang lưu trữ. Tài khoản thật chưa thay đổi.')">${field('date','Ngày nghỉ việc','date','2026-11-10',true)}${field('reason','Lý do','textarea','',true)}<label class="check"><input type="checkbox" required><span>Đã kiểm tra bàn giao và xác nhận thu hồi quyền.</span></label><button class="danger" style="margin-top:16px">Xác nhận nghỉ việc</button></form>`)}
function candidatesPage(){return header(`<button class="primary" onclick="candidateEditor()">+ Thêm ứng viên</button>`)+`<div class="toolbar"><input placeholder="Tìm ứng viên, vị trí…" aria-label="Tìm ứng viên" value="${esc(query)}" onchange="query=this.value;render()"></div><div class="panel">${table(['Ứng viên','Vị trí','Ngày nhận CV','Giai đoạn','Lịch phỏng vấn'],candidates.filter(c=>!query||[c.name,c.position].join(' ').toLowerCase().includes(query.toLowerCase())).map(c=>`<tr class="clickrow" onclick="openCandidate('${c.id}')"><td><strong>${esc(c.name)}</strong><div class="small muted">${c.id}</div></td><td>${esc(c.position)}</td><td>${c.received}</td><td>${badge(c.stage,c.stage==='Chờ phỏng vấn'?'warn':'')}</td><td>${esc(c.interview.replace('T',' ')||'Chưa hẹn')}</td></tr>`))}</div>`}
function candidateEditor(id){let c=candidates.find(x=>x.id===id)||{};modal(id?'Cập nhật ứng viên':'Thêm ứng viên',`<form onsubmit="saveCandidate(event,'${id||''}')"><div class="fields">${field('name','Họ tên','text',c.name||'',true)}${field('position','Vị trí ứng tuyển','text',c.position||'Content Marketing',true,['Content Marketing','Vận hành Sàn TMĐT','HR'])}${field('phone','Số điện thoại','tel')}${field('email','Email','email')}${field('birthday','Ngày sinh (nếu đã cung cấp)','date',toISO(c.birthday))}${field('received','Ngày nhận hồ sơ','date',toISO(c.received)||'2026-11-10',true)}${field('stage','Giai đoạn','text',c.stage||'Mới nhận',true,['Mới nhận','Chờ phỏng vấn','Đang đánh giá','Mời nhận việc','Đã nhận việc','Không phù hợp'])}${field('interview','Lịch phỏng vấn','datetime-local',c.interview||'')}${field('cv','File CV','file')}${field('portfolio','Portfolio','url')}${field('notes','Kết quả / bước tiếp theo','textarea','',false,null,true)}</div><button class="primary">Lưu ứng viên</button></form>`)}
function saveCandidate(e,id){e.preventDefault();let f=new FormData(e.target),c={id:id||'UV'+String(candidates.length+1).padStart(3,'0'),name:f.get('name'),position:f.get('position'),stage:f.get('stage'),interview:f.get('interview'),received:humanDate(f.get('received')),birthday:humanDate(f.get('birthday'))};if(id)Object.assign(candidates.find(x=>x.id===id),c);else candidates.unshift(c);$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã lưu ứng viên trong bản mẫu. File CV chưa tải lên máy chủ.')}
function openCandidate(id){let c=candidates.find(x=>x.id===id);drawer(esc(c.name),`<div class="row"><span>${c.id} · ${esc(c.position)}</span>${badge(c.stage)}</div><div class="panel" style="margin-top:20px"><h3>Thông tin tuyển dụng</h3><p>Ngày nhận hồ sơ: ${c.received}</p><p>Lịch phỏng vấn: ${esc(c.interview.replace('T',' ')||'Chưa hẹn')}</p><p>Ngày sinh: ${esc(c.birthday||'Chưa cung cấp')}</p><div class="muted">CV / portfolio: chưa có tệp minh họa.</div></div><div class="actions"><button class="primary" onclick="candidateEditor('${id}')">Cập nhật hồ sơ / phỏng vấn</button><button onclick="convertCandidate('${id}')">Tiếp nhận thành nhân viên</button></div><p class="datahint">Liên kết application_id / candidate_id sang employee_id; kiểm tra trùng để không tạo hai hồ sơ cho cùng ứng viên.</p>`)}
function convertCandidate(id){let c=candidates.find(x=>x.id===id);if(c.linkedEmployee){toast('Ứng viên đã liên kết hồ sơ '+c.linkedEmployee);return}$('#detail').close();employeeEditor();$('#modal form').elements.name.value=c.name;const form=$('#modal form');const handler=form.onsubmit;form.onsubmit=e=>{let before=employees.length;handler(e);if(employees.length>before){c.linkedEmployee=employees.at(-1).id;c.stage='Đã nhận việc';render()}}}
let contracts=[{id:'HD001',employee:'NS002',kind:'Thử việc',signed:'2026-09-16',start:'2026-09-16',end:'2026-11-15',state:'Cần đánh giá thử việc'},{id:'HD002',employee:'NS003',kind:'Chính thức',signed:'2026-09-01',start:'2026-09-01',end:'2026-11-30',state:'Cần chuẩn bị gia hạn'}];
function contractsPage(){return header(`<button class="primary" onclick="contractEditor()">+ Thêm hợp đồng</button>`)+`<div class="toolbar"><span class="period">Ngày mẫu: 10/11/2026</span><button onclick="go('settings')" ${role==='hr'?'disabled':''}>Thiết lập mốc nhắc</button></div><div class="panel">${table(['Nhân viên','Loại hồ sơ','Ngày ký','Ngày hết hạn','Việc cần làm','Thao tác'],contracts.map(c=>{let e=employees.find(x=>x.id===c.employee);return `<tr><td><strong>${esc(e?.name||c.employee)}</strong><div class="small muted">${c.employee}</div></td><td>${esc(c.kind)}</td><td>${humanDate(c.signed)}</td><td>${humanDate(c.end)}</td><td>${badge(c.state,'warn')}</td><td><button onclick="openEmployee('${c.employee}','work')">Mở hồ sơ</button></td></tr>`}))}</div><div class="note info">Bản thật phát thông báo theo mốc đã cấu hình, chống trùng theo nhân viên + hợp đồng + mốc nhắc. Hợp đồng đã thay thế/nghỉ việc không tiếp tục nhắc.</div>`}
function contractEditor(employee){modal('Thêm hợp đồng / phụ lục',`<form onsubmit="saveContract(event)"><div class="fields">${field('employee','Nhân viên','text',employee||employees[0].id,true,employees.filter(e=>e.state==='active').map(e=>[e.id,e.name]))}${field('kind','Loại hồ sơ','text','Chính thức',true,['Thử việc','Chính thức','Gia hạn','Phụ lục'])}${field('number','Số hợp đồng / hồ sơ','text','',true)}${field('signed','Ngày ký','date','2026-11-10',true)}${field('start','Ngày hiệu lực','date','2026-11-16',true)}${field('end','Ngày hết hạn','date','2027-11-15',true)}${field('file','Tệp hợp đồng','file')}${field('previous','Hợp đồng được thay thế / bổ sung','text','',false,contracts.map(c=>[c.id,c.id+' · '+c.kind]))}</div><div class="note">Tạo mốc mới, giữ hợp đồng cũ để tra cứu. Bản thật cần ngày hiệu lực và trạng thái thay thế để chạy nhắc đúng.</div><button class="primary">Lưu hợp đồng</button></form>`)}
function saveContract(e){e.preventDefault();let f=new FormData(e.target);if(f.get('end')<f.get('start')){toast('Ngày hết hạn phải từ ngày hiệu lực trở đi.');return}contracts.push({id:f.get('number'),employee:f.get('employee'),kind:f.get('kind'),signed:f.get('signed'),start:f.get('start'),end:f.get('end'),state:'Đã ghi nhận hồ sơ mẫu'});$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã thêm hợp đồng trong bản mẫu.')}
function birthdaysPage(){let isCandidates=sub==='candidate',month=filter||'11',list=(isCandidates?candidates:employees.filter(e=>e.state==='active')).filter(e=>e.birthday&&e.birthday.split('/')[1]===month);return header()+`<div class="tabs"><button class="${!isCandidates?'active':''}" onclick="sub='employee';render()">Nhân viên</button><button class="${isCandidates?'active':''}" onclick="sub='candidate';render()">Ứng viên</button></div><div class="toolbar"><select aria-label="Tháng sinh nhật" onchange="filter=this.value;render()">${Array.from({length:12},(_,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${Number(month)===i+1?'selected':''}>Tháng ${i+1}</option>`).join('')}</select><span class="period">${list.length} người có sinh nhật trong tháng</span></div><div class="grid equal"><div class="panel"><h2>Sinh nhật tháng ${Number(month)}</h2>${table(['Họ tên','Ngày sinh nhật','Bộ phận / vị trí'],list.sort((a,b)=>a.birthday.localeCompare(b.birthday)).map(e=>`<tr><td>${esc(e.name)}</td><td><strong>${e.birthday.slice(0,5)}</strong></td><td>${esc(e.team||e.position)}</td></tr>`))}<p class="datahint">Người chưa cung cấp ngày sinh hiển thị ở mục thiếu dữ liệu; không tự suy đoán ngày sinh.</p></div><div class="panel"><h2>Lịch ngày sinh nhật</h2><div class="monthgrid">${Array.from({length:new Date(2026,Number(month),0).getDate()},(_,i)=>{let matches=list.filter(e=>Number(e.birthday.slice(0,2))===i+1);return `<div class="daybox ${matches.length?'birth':''}"><span>${i+1}</span>${matches.map(x=>`<small>${esc(x.name)}</small>`).join('')}</div>`}).join('')}</div><p class="small muted">Danh mục ngày trong tháng, không biểu diễn thứ trong tuần.</p></div></div>`}
let narrativeDraft={results:'',difficulties:'',support:'',next:''};
function reportsPage(){let boss=role==='boss',submitted=boss||sub==='submitted',selectedWeek='02–08/11/2026';return header(`<span class="period">Tuần ${selectedWeek}</span>`)+`<div class="tabs">${!boss?`<button class="${!submitted?'active':''}" onclick="sub='draft';render()">Báo cáo của tôi</button>`:''}<button class="${submitted?'active':''}" onclick="sub='submitted';render()">${boss||role==='admin'?'Báo cáo nhân viên':'Báo cáo đã nộp'}</button></div>${submitted?`<div class="panel"><h2>Tình trạng nộp báo cáo</h2>${table(['Nhân viên','Tuần','Trạng thái','Phiên bản','Thao tác'],people.filter(p=>boss||role==='admin'||p.job===role).map(p=>{let rs=reports.filter(r=>r.owner===p.id);return `<tr><td>${person(p.id)}</td><td>${selectedWeek}</td><td>${badge(rs.length?'Đã nộp':'Chưa nộp',rs.length?'':'warn')}</td><td>${rs.length?'v'+rs.at(-1).version:'—'}</td><td>${rs.length?`<button onclick="openReport('${rs.at(-1).id}')">Xem báo cáo</button>`:'Chờ nhân viên nộp'}</td></tr>`}))}</div>`:`<div class="note info">Nháp riêng tư. Hệ thống tổng hợp công việc và kết quả chuyên môn; nhân viên bổ sung nhận xét rồi nộp cho Sếp.</div><div class="panel"><h2>Tổng hợp tự động</h2><p class="muted">Bản mẫu minh họa bố cục; chưa thực hiện truy vấn theo kỳ lịch sử.</p>${taskTable(visibleTasks())}${role==='market'||role==='admin'?`<h3 style="margin-top:22px">Kinh doanh & KOC</h3><p>Nguồn bán hàng 02–08/11: TikTok ${money(SOURCE.tiktok.totals.revenue)}, Shopee ${money(SOURCE.shopee.totals.revenue)}.</p><div class="note">KOC chưa xác nhận kỳ: không tự đưa số KOC vào bản nộp tuần.</div>`:''}${role==='content'?'<h3 style="margin-top:22px">Sản xuất & video</h3><p>Tách số kịch bản xong, quay xong, dựng xong và lượt đăng theo ngày hoàn tất từng bước. D7 chỉ gồm lượt đăng đủ nguồn và đúng cửa sổ.</p>':''}${role==='hr'?'<h3 style="margin-top:22px">Nhân sự</h3><p>Tổng hợp nhận việc, phỏng vấn, hợp đồng cần xử lý. Báo cáo Sếp không kèm lương hoặc số giấy tờ cá nhân.</p>':''}</div><div class="panel"><h2>Nhận xét & kế hoạch</h2><form onsubmit="submitReport(event)">${field('results','Kết quả khác trong tuần','textarea',narrativeDraft.results)}${field('difficulties','Khó khăn / việc chưa hoàn thành','textarea',narrativeDraft.difficulties)}${field('support','Cần hỗ trợ','textarea',narrativeDraft.support)}${field('next','Kế hoạch tuần tới','textarea',narrativeDraft.next)}<div class="actions"><button type="button" onclick="saveNarrative(this.form)">Lưu nháp</button><button class="primary">Nộp báo cáo tuần</button></div></form></div>`}`}
function saveNarrative(form){narrativeDraft=Object.fromEntries(new FormData(form));toast('Đã lưu nháp trong phiên. Sếp chưa thấy nháp này.')}
function submitReport(e){e.preventDefault();saveNarrative(e.target);let owner=people.find(p=>p.job===role)?.id||'u1',v=reports.filter(r=>r.owner===owner).length+1;reports.push({id:'BC'+Date.now(),owner,week:'02–08/11/2026',version:v,submitted:'10/11/2026 · Phiên mẫu',summary:narrativeDraft.results||'Báo cáo minh họa đã nộp.',state:'Đã nộp',snapshot:JSON.parse(JSON.stringify(visibleTasks()))});notices.unshift({title:'Có báo cáo tuần mới',body:names(owner)+' vừa nộp phiên bản '+v+'.',target:'reports',read:false,hr:false});sub='submitted';render();toast('Đã nộp một phiên bản báo cáo trong bản mẫu.')}
function openReport(id){let r=reports.find(x=>x.id===id);drawer('Báo cáo · '+esc(names(r.owner)),`<div class="row"><span>Tuần ${r.week}</span>${badge('Phiên bản '+r.version)}</div><p class="muted small">Nộp lúc ${r.submitted}</p><div class="panel"><h3>Nội dung đã nộp</h3><p style="white-space:pre-wrap">${esc(r.summary)}</p></div>${r.snapshot?taskTable(r.snapshot):'<div class="note info">Báo cáo có sẵn là dữ liệu mô phỏng. Bản thật chứa snapshot task, nguồn số liệu và nhận xét tại thời điểm nộp.</div>'}<button onclick="toast('Bản thật dùng ExcelJS xuất XLSX của đúng snapshot/phiên bản. Bản giao diện chưa tạo file Excel.')">Xuất Excel phiên bản này</button><p class="datahint">Nháp không xuất hiện ở màn hình Sếp. Dữ liệu phát sinh sau khi nộp không sửa ngược bản đã nộp.</p>`)}
function usersPage(){return header(`<button class="primary" onclick="userEditor()">+ Cấp tài khoản</button>`)+`<div class="note info">${role==='hr'?'HR tạo tài khoản và cấp ROLE chuyên môn: Vận hành Sàn TMĐT, HR, Content Marketing. Cấp Admin/Sếp dành cho Admin. Đây là đề xuất phân quyền cần duyệt.':'Admin quản trị toàn bộ tài khoản. Đặt lại mật khẩu website; không hiển thị mật khẩu hiện tại từ mã băm.'}</div><div class="panel">${table(['Nhân viên','Tên đăng nhập','ROLE','Trạng thái','Thao tác'],[{name:'Quản trị hệ thống',username:'admin',roles:['admin'],active:true},{name:'Sếp',username:'sep',roles:['boss'],active:true},...userRows].map((u,i)=>`<tr><td>${esc(u.name)}</td><td>${esc(u.username)}</td><td>${u.roles.map(k=>`<span class="role-chip">${roleNames[k]}</span>`).join(' ')}</td><td>${badge(u.active?'Đang hoạt động':'Đã khóa',u.active?'':'gray')}</td><td>${role==='admin'||!u.roles.some(k=>['admin','boss'].includes(k))?`<button onclick="editUser(${i})">${role==='admin'?'Quản lý':'Cấp ROLE'}</button>`:'Chỉ Admin thay đổi'}</td></tr>`))}</div><div class="panel"><h2>5 ROLE hiển thị</h2>${table(['ROLE','Quyền'],[['Admin','Toàn quyền; quản lý tài khoản, mật khẩu, ROLE, cấu hình, dữ liệu.'],['Sếp','Xem task toàn bộ nhân viên, giao việc, nhận và xem báo cáo đã nộp.'],['Vận hành Sàn TMĐT','Checklist, bán hàng, KOC, nhập dữ liệu và nộp báo cáo.'],['HR','Hồ sơ nhân viên/ứng viên, hợp đồng, lương, thông báo, cấp ROLE chuyên môn.'],['Content Marketing','Checklist, kịch bản, quay, dựng, đăng, theo dõi hiệu quả video.']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`))}</div>`}
function userEditor(employee){let e=employees.find(x=>x.id===employee),available=Object.entries(roleNames).filter(([k])=>role==='admin'||!['admin','boss'].includes(k));modal('Cấp tài khoản cho nhân viên',`<form onsubmit="saveUser(event,'${employee||''}')"><div class="fields">${field('name','Họ tên','text',e?.name||'',true)}${field('username','Tên đăng nhập','text','',true)}${field('password','Mật khẩu khởi tạo (ít nhất 11 ký tự)','password','',true)}${field('employee','Liên kết hồ sơ nhân viên','text',employee||'',true,employees.filter(x=>!x.user).map(x=>[x.id,x.id+' · '+x.name]))}</div><fieldset style="border:1px solid var(--line);border-radius:8px;margin-bottom:18px"><legend>ROLE · có thể chọn nhiều</legend>${available.map(([k,v])=>`<label class="check" style="margin:10px"><input type="checkbox" name="roles" value="${k}" ${e?.job===k?'checked':''}><span>${v}</span></label>`).join('')}</fieldset><button class="primary">Tạo tài khoản & liên kết</button></form>`);$('#modal form').elements.password.minLength=11}
function saveUser(e,employee){e.preventDefault();let f=new FormData(e.target),roles=f.getAll('roles'),username=String(f.get('username')).trim();if(!roles.length){toast('Chọn ít nhất một ROLE.');return}if(!/^[A-Za-z0-9._-]{3,64}$/.test(username)){toast('Username cần 3–64 ký tự: chữ, số, dấu chấm, gạch dưới hoặc gạch ngang.');return}if(['admin','sep',...userRows.map(x=>x.username)].some(x=>x.toLowerCase()===username.toLowerCase())){toast('Tên đăng nhập đã tồn tại.');return}userRows.push({name:f.get('name'),username,roles,active:true});let emp=employees.find(x=>x.id===(employee||f.get('employee')));if(emp)emp.user=username;$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã tạo tài khoản mẫu. Mật khẩu vừa nhập không được lưu trong dữ liệu bản mẫu.')}
function editUser(index){let u=index===0?{name:'Quản trị hệ thống',username:'admin',roles:['admin'],active:true}:index===1?{name:'Sếp',username:'sep',roles:['boss'],active:true}:userRows[index-2];let options=Object.entries(roleNames).filter(([k])=>role==='admin'||!['admin','boss'].includes(k));modal('Quản lý · '+esc(u.username),`<form onsubmit="saveUserEdit(event,${index})">${field('name','Họ tên','text',u.name,true)}${role==='admin'?field('username','Tên đăng nhập','text',u.username,true):''}<fieldset style="border:1px solid var(--line);border-radius:8px;margin-bottom:16px"><legend>ROLE được cấp</legend>${options.map(([k,v])=>`<label class="check" style="margin:10px"><input type="checkbox" name="roles" value="${k}" ${u.roles.includes(k)?'checked':''}><span>${v}</span></label>`).join('')}</fieldset>${field('reason','Lý do thay đổi','textarea','',true)}<button class="primary">Lưu phân quyền</button></form>${role==='admin'?`<details><summary>Đặt lại mật khẩu website</summary><form onsubmit="event.preventDefault();document.getElementById('modal').dataset.dirty='false';toast('Bản thật lưu Argon2id và thu hồi session cũ. Bản mẫu không thay tài khoản thật.');event.target.reset()">${field('password','Mật khẩu mới (ít nhất 11 ký tự)','password','',true)}<button>Đặt lại mật khẩu</button></form></details><button class="danger" onclick="toast('Cần xác nhận khóa và bàn giao. Bản mẫu chưa vô hiệu tài khoản thật.')">Khóa tài khoản</button>`:''}`);let p=$('#modal [name=password]');if(p)p.minLength=11}
function saveUserEdit(e,i){e.preventDefault();let f=new FormData(e.target),rs=f.getAll('roles');if(!rs.length){toast('Chọn ít nhất một ROLE.');return}if(i<2){toast('Tài khoản Admin/Sếp hệ thống chỉ minh họa; chưa thay đổi cấu hình thật.');return}Object.assign(userRows[i-2],{name:f.get('name'),roles:rs,...(f.get('username')?{username:f.get('username')}:{})});$('#modal').dataset.dirty='false';$('#modal').close();render();toast('Đã cập nhật ROLE trong dữ liệu mẫu. Bộ chọn ROLE phía trên chỉ phục vụ xem thiết kế.')}

 sales:{repo:'web/business.tsx → Metrics; server/metrics.ts; metric_batches/metrics; web/reports.tsx',change:'Tạo báo cáo nguồn bán hàng ngày/tuần cho TikTok và Shopee, chọn nguồn bằng loại tải lên. Bổ sung shop/company bắt buộc, mapping theo header thay vị trí cột.',fields:[['company_id / shop_id / platform','uuid / uuid / enum','Bắt buộc','Danh mục riêng; shop thuộc đúng company và platform'],['business_date','date','Bắt buộc','Cột Ngày, DD/MM/YYYY; tiêu đề dòng 2 trong 2 mẫu'],['revenue','decimal','Bắt buộc','Cột Doanh thu'],['effective_revenue','decimal','Tùy chọn','Cột Doanh thu đơn hàng hiệu quả; không thay nhãn Doanh thu'],['orders','integer','Bắt buộc','Cột Tổng số đơn hàng, không dùng Tổng số bưu kiện'],['cancelled_orders','integer','Bắt buộc','Cột Số lượng đơn đã hủy'],['refunded_orders','integer','Bắt buộc','Cột SL đơn hoàn tiền; không dùng SL khách hoàn tiền'],['refund_amount / cancellation_amount','decimal','Tùy chọn','Số tiền đơn hàng hoàn tiền / Số tiền đơn hàng hủy'],['cancel_rate / refund_rate','decimal 0..1','Tự tính','SUM(số đơn tương ứng) / SUM(tổng đơn) trong cùng kỳ; mẫu số 0 → N/A']],rules:['Hai mẫu có cùng header và không có định danh sàn trong nội dung đã kiểm tra. Chỉ xác thực schema; cần người tải xác nhận đúng shop/platform.','Doanh thu nguồn và GMV KOC không cộng vào nhau. Không gộp số liệu hai pháp nhân.','Không lấy trung bình Tỷ lệ hoàn tiền từng ngày; không coi hoàn tiền là đã nhận hàng trả về.','Nếu số nguồn không đủ chứng minh số đơn trả hàng, hiển thị N/A và cần nguồn riêng.'],tests:['Cùng tên file nhưng nội dung đổi vẫn kiểm tra checksum + khóa phạm vi.','Đối chiếu mẫu TikTok: doanh thu 67.492.567; 930 đơn; 100 hủy; 4 hoàn tiền. Shopee: 28.040.779; 360; 36; 2. Đây là tổng file mẫu, chưa nghiệm thu vận hành.']},
 koc:{repo:'web/business.tsx; server/metrics.ts; cần schema/grain KOC aggregate mới hoặc mở rộng registry metrics',change:'Tạo tab tổng KOC và Top 10 theo GMV. Tách kỳ nguồn, creator identity và hoa hồng ước tính.',fields:[['creator_handle / creator_id','string','Bắt buộc','Tên nhà sáng tạo; cần chuẩn hóa định danh, giữ nguyên giá trị gốc'],['period_start / period_end','date','Bắt buộc','File mẫu không có kỳ trong nội dung; người tải nhập và xác nhận kỳ xuất'],['gmv','decimal','Bắt buộc','GMV nhờ nhà sáng tạo (B)'],['orders','integer','Bắt buộc','Đơn hàng đã ghi nhận (F)'],['refund_amount','decimal','Bắt buộc','Hoàn tiền (E), có thể khác cohort/kỳ GMV'],['estimated_commission','decimal','Bắt buộc','Hoa hồng ước tính (V), không gọi là phải trả/đã trả'],['refund_items','integer','Tùy chọn','Số món đã hoàn tiền (H); không đổi thành số đơn'],['share','decimal','Tự tính','GMV từng KOC / GMV mọi KOC cùng kỳ/shop/nguồn sau xử lý trùng']],rules:['Dòng 1 là header, dòng 2 là mô tả; dữ liệu bắt đầu dòng 3. Không đưa mô tả vào tổng.','Top10 sắp GMV giảm dần, đồng hạng dùng creator key ổn định; tỷ trọng mẫu số là toàn bộ KOC, không chỉ Top10.','Mẫu có 1.307 dòng KOC; tổng GMV 52.399.786; hoa hồng ước tính 1.678.199; hoàn tiền 2.029.427. Kỳ chưa xác nhận.','File thiếu số đơn hủy/hoàn riêng và hoa hồng quyết toán. N/A khác 0. Không suy ra bằng số món hoàn tiền.'],tests:['Tổng tỷ trọng Top10 có thể <100%; mẫu số 0 hiện N/A.','Tải lại kỳ chồng lấn không nhân GMV; yêu cầu revision hoặc chặn.']},
 imports:{repo:'web/business.tsx ImportUpload/preview; server/metrics.ts /imports; server/files.ts; metric_batches',change:'Bộ chọn 5 loại file cố định, xác thực theo nội dung; tên gốc tùy ý. Bản HTML đọc XLSX/CSV cục bộ để xem cấu trúc, không thay thế backend kiểm tra hoặc lưu database.',fields:[['report_type','enum','Bắt buộc','TIKTOK_SALES / SHOPEE_SALES / KOC_SALES / TIKTOK_RETURNS / VIDEO_PERFORMANCE'],['company_id / shop_or_channel_id','uuid','Bắt buộc','Chọn từ danh mục có platform và pháp nhân'],['file_original_name / checksum / bytes','string / SHA256 / binary','Bắt buộc','Giữ tên gốc; loại file dựa nội dung và chữ ký file; checksum do server tính'],['sheet / header_row / mapping_version','string / int / int','Bắt buộc','Tự nhận diện nếu duy nhất; nhiều sheet đúng thì yêu cầu chọn'],['period_start / end / period_basis','date / date / enum','Bắt buộc','DATE_ROWS / EXPORT_PERIOD / SNAPSHOT; không suy ra từ tên file'],['preview_rows / errors','array','Tự sinh','Sheet, dòng, header/cột, giá trị lỗi, mã lỗi và hướng khắc phục'],['source_confirmation','actor + timestamp','Bắt buộc khi mơ hồ','Ví dụ sales cùng schema hoặc KOC thiếu kỳ'],['commit / revision','atomic','Sau kiểm tra','Server kiểm lại quyền, checksum, dữ liệu và version; ghi trọn bộ hoặc rollback']],rules:['Lỗi chặn: thiếu cột bắt buộc, sai loại, rỗng, số âm/không hợp lệ, ngày không tồn tại, khóa dòng mâu thuẫn, kỳ không phù hợp, thiếu quyền.','Mẫu đã có nguồn cần khóa company+shop+platform+kind+grain+period+entity; checksum chỉ bắt file byte giống, không đủ bắt cùng dữ liệu xuất lại.','TikTok hoàn/hủy: sheet OrderSKUList, header dòng1, mô tả dòng2, 113 dòng dữ liệu/112 Order ID trong mẫu. Dùng địa chỉ ô để nhóm đúng hàng: XML nguồn lặp row elements cùng r.','Order Amount và Order Refund Amount cấp đơn phải đối chiếu cùng Order ID, không SUM theo SKU. Nếu cùng đơn có tiền cấp đơn mâu thuẫn thì báo lỗi.','Không đưa người nhận/điện thoại/địa chỉ người mua vào mô hình báo cáo; xử lý tối thiểu dữ liệu cần thiết.','Không cộng file hoàn/hủy thêm vào chỉ tiêu tổng hợp sales; chỉ đối chiếu. Chọn basis created/paid/cancelled theo báo cáo đã thống nhất.'],tests:['Đổi tên tùy ý vẫn nhận đúng mẫu; đổi thứ tự cột không làm sai mapping.','Tải KOC vào sales: chặn và nêu thiếu cột. Upload CSV báo lỗi dấu ngoặc/số/ngày.','Chọn nhiều sheet phù hợp yêu cầu chọn; thao tác đổi loại xóa kết quả kiểm tra trước.','Kiểm tra file và commit đều có xác thực server. Không tin report_type của client.']},
 production:{repo:'web/tasks.tsx + web/modules.tsx; server/record-config.ts CONTENT/SHOOT/DELIVERABLE/PUBLICATION; server/tasks.ts validateTaskWork; records',change:'Một hồ sơ nội dung xuyên suốt; các bước có dữ liệu riêng và timestamp hoàn thành. Liên kết task nguồn thay vì tạo nhiều task trùng nội dung.',fields:[['content_id / title / brief','uuid / string / text','Bắt buộc','Tên nội dung, mục tiêu, campaign nếu có'],['script_text / script_assets / writer_id','text / asset[] / uuid','Bắt buộc trước xong kịch bản','Nội dung thoại và tài liệu riêng'],['shoot_location / scheduled_shoot_at','text / timestamptz','Bắt buộc trước quay','Kế hoạch quay'],['participants / camera_operator','user[] hoặc external[] / uuid','Bắt buộc','Danh mục user đang hoạt động; người ngoài có tên, vai trò và ghi chú'],['shot_at / raw_assets','timestamptz / asset hoặc URL[]','Bắt buộc trước xong quay','Ngày quay thực tế; file/link tư liệu'],['editor_id / final_assets / edited_at','uuid / asset hoặc URL[] / timestamptz','Bắt buộc trước xong dựng','Clip hoàn chỉnh và người dựng'],['stage_events','append-only','Tự sinh','Mỗi lần chuyển bước giữ actor, time, trước/sau; không chỉ lưu trạng thái cuối']],rules:['Tách CLIP_READY và PUBLISHED. Video dựng xong nhưng chưa đăng vẫn được báo cáo đúng số clip hoàn chỉnh.','Không cho nhảy bước khi thiếu dữ liệu bắt buộc; lưu nháp được phép chưa đủ trường.','Một nội dung có nhiều publication, mỗi publication gắn nền tảng/kênh riêng.','Task mẫu video hiện tại bắt đến published mới SUBMITTED. Phải tách production output và publication khi triển khai, giữ legacy snapshot.'],tests:['Đếm kịch bản/quay/dựng theo stage_completed_at trong tuần, kể cả đã chuyển sang bước sau.','Nộp xong dựng cần link/file đầu ra; đăng trước quay hoặc tương lai bị chặn.','Giữ dữ liệu khi chuyển tab, tránh drawer rerender làm mất nháp.']},
 videos:{repo:'web/business.tsx Metrics VIDEO; server/metrics.ts; records PUBLICATION; cần publication_metrics snapshot/window',change:'Một dòng cho mỗi lượt đăng; gắn video_id từ URL, content_id, channel_id và thời gian. Màn hình D7 phân biệt đủ kỳ/chưa đủ kỳ/thiếu nguồn.',fields:[['publication_id / content_id','uuid','Bắt buộc','Liên kết nội dung và từng lượt đăng'],['platform / channel_id / video_url / platform_video_id','enum / uuid / URL / string','Bắt buộc','Không dùng tiêu đề làm khóa video'],['published_at / collected_at','timestamptz','Bắt buộc','Post time / Time; file mẫu thiếu năm và ngày dạng chữ tiếng Việt'],['views / likes / comments / shares','integer','Theo nguồn','Total views / Total likes / Total comments / Total shares'],['interaction_rate','decimal','Tự tính','(likes+comments+shares)/views cùng snapshot; views=0 → N/A'],['gmv / currency / attribution / source','decimal / enum / text / reference','Cần nguồn bổ sung','File hiện tại không có GMV; không tự điền 0'],['window_start / window_end / measured_basis','timestamp / enum','Cần cho D7','D7 đề xuất 168 giờ từ published_at; cần chốt với cách xuất dữ liệu nền tảng']],rules:['Snapshot ngày 10/11 của video đăng tháng6 không phải số liệu7ngày. 7ngày attribution của KOC cũng không phải 7ngày sau đăng video.','Không trừ hai cumulative snapshot để suy ra unique viewers/ratio nếu nguồn không hỗ trợ.','Ngày đăng có thể nằm trước kỳ ghi nhận. Không chặn video cũ chỉ vì post date nằm ngoài tuần upload.','Thiếu năm cần xác nhận người dùng và lưu provenance, không lấy năm từ tên file.'],tests:['Giữ số liệu lịch sử mỗi snapshot; import mới không sửa snapshot đã dùng trong báo cáo nộp.','Cùng video trên hai kênh giữ riêng publication; GMV thiếu hiển thị N/A.']},
 employees:{repo:'web/employees.tsx; server/employees.ts; server/employee-history.ts; employee_profiles/positions/documents/revisions',change:'Giữ hồ sơ cơ bản, thêm timeline công tác, hợp đồng nhiều bản và lịch sử lương có ngày hiệu lực; HR toàn công ty.',fields:[['employee_id / employee_code','uuid / string','Bắt buộc','Mã duy nhất không phân biệt hoa thường, giữ số0 đầu'],['name / joined_on / team_id / positions','string / date / uuid / array','Bắt buộc','Vị trí khác ROLE truy cập'],['birthday / contact','date / object','Tùy chọn','Không tự điền ngày sinh thiếu'],['employment_phase / type','enum','Bắt buộc','PROBATION/OFFICIAL/LEFT; FULL_TIME/PART_TIME/INTERN/CONTRACTOR'],['probation_start / end / official_start','date','Theo giai đoạn','Mốc thực tế; không tính ngày bắt đầu chính thức từ hợp đồng một cách ngầm định'],['linked_user_id','uuid unique','Sau cấp tài khoản','Một hồ sơ một user; HR cấp chuyên môn theo policy mới'],['documents / history','asset[] / revision[]','Theo thao tác','Không giả lập trước/sau của dữ liệu lịch sử đã mất']],rules:['Thêm hồ sơ không tự cấp ROLE. Wizard cấp user có liên kết hồ sơ và ROLE chuyên môn riêng.','Nghỉ việc: xem task mở, bàn giao, ngày/lý do, thu hồi session và quyền chia sẻ; không xóa lịch sử.','Bản mẫu dùng hồ sơ hoàn toàn giả. Định danh/thuế/ngân hàng đề xuất giữ quyền Admin như repo, cần chốt nếu HR cần thêm.','Lương dùng mức có hiệu lực theo ngày. Mức tương lai không ghi đè mức hiện hành. Cần employee_salary_terms thay một trường payroll_cipher duy nhất.'],tests:['HR đọc/sửa hồ sơ Admin tạo; duplicate code báo đúng trường.','Cấp account và liên kết hồ sơ atomically, không hai user cùng profile.','Sửa tên không đổi phase. Salary/doc/history kiểm quyền server.']},

function renderDev(){let s=SPEC[page]||SPEC.overview;$('#dev-content').innerHTML=`<header class="dialog-head"><div><div class="eyebrow">BÀN GIAO DEV · THIẾT KẾ CHƯA TRIỂN KHAI</div><h2>${pages[page]}</h2></div><button aria-label="Đóng hướng dẫn" onclick="devVisible=false;document.getElementById('dev').close()">×</button></header><div class="dialog-body"><div class="tabs">${[['screen','Màn hình này'],['migration','Kết hợp repo'],['decisions','Cần chốt']].map(([k,l])=>`<button class="${devTab===k?'active':''}" onclick="devTab='${k}';renderDev()">${l}</button>`).join('')}</div>${devTab==='screen'?`<h3>Phạm vi thay đổi</h3><p>${esc(s.change)}</p><h3>Vị trí trong repo hiện có</h3><div class="schema">${esc(s.repo)}</div><h3 style="margin-top:20px">Dữ liệu cần có</h3>${table(['Trường / đối tượng','Kiểu','Điều kiện','Nguồn / cách dùng'],s.fields.map(f=>`<tr>${f.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`))}<h3 style="margin-top:20px">Quy tắc xử lý</h3><ul>${s.rules.map(r=>`<li>${esc(r)}</li>`).join('')}</ul><h3>Tiêu chí nghiệm thu</h3><ul>${s.tests.map(r=>`<li>${esc(r)}</li>`).join('')}</ul>`:devTab==='migration'?`<div class="schema">${esc(MIGRATION)}</div>`:`<div class="note">Các điểm dưới đây là đề xuất thiết kế, chưa coi là quyết định triển khai của bạn.</div>${table(['Mục','Đề xuất / dữ liệu còn thiếu'],DECISIONS.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`))}`}<div class="actions" style="margin-top:22px"><button class="primary" onclick="downloadSpec()">Tải đặc tả toàn bộ tab (.md)</button></div><p class="datahint">Đặc tả nhúng trong bản giao diện; API/schema mới là thiết kế đề xuất, không tuyên bố repo đã có chức năng.</p></div>`}
function downloadSpec(){let text='# Super Net — Đặc tả giao diện 5 ROLE\n\n'+MIGRATION+'\n\n## Phân quyền\n\n'+Object.entries(permissions).map(([r,ps])=>'- '+roleNames[r]+': '+ps.map(p=>pages[p]).join(', ')).join('\n')+'\n\n';for(let [key,s]of Object.entries(SPEC)){text+='## '+pages[key]+'\n\n'+s.change+'\n\nRepo: '+s.repo+'\n\n| Trường | Kiểu | Điều kiện | Nguồn |\n|---|---|---|---|\n'+s.fields.map(row=>'| '+row.join(' | ')+' |').join('\n')+'\n\nQuy tắc:\n'+s.rules.map(r=>'- '+r).join('\n')+'\n\nNghiệm thu:\n'+s.tests.map(r=>'- '+r).join('\n')+'\n\n'}text+='## Các điểm cần chốt\n\n'+DECISIONS.map(([k,v])=>'- '+k+': '+v).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download='五角色介面規格_Dac_ta_giao_dien_5_ROLE_SuperNet_20261110.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('#dev').addEventListener('close',()=>devVisible=false);
document.addEventListener('visibilitychange',()=>{if(document.hidden)$$('[id^="secret-"]').forEach(x=>x.textContent='••••••••••')});
render();
</script></body></html>
